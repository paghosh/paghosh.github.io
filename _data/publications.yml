- id: ghosh2026flu
  title: "Stay healthy, stay employed: how flu vaccination might impact women's earnings"
  authors: ["Pallab Ghosh", "Firat Demir", "Myongjin Kim", "Ahmed Chaudhry", "Junying Zhao"]
  journal: "Applied Economics"
  year: 2026
  pages: "1-16"
  doi: "10.1080/00036846.2026.2656819"
  pdf: "/assets/papers/ghosh2026flu.pdf"
  area: labor
  status: published
  featured: false
  abstract: >
    This paper examines the effects of state-level adult and child seasonal flu vaccination rates on
    hourly real wages for women. Using an IV method to address possible endogeneity, we find a
    significantly positive effect of adult vaccination on women's wages. Furthermore, we show that this
    effect is stronger for working mothers in age groups 16-24 and 25-44, and those with younger
    children aged 6 months-12 years. We also find that children's vaccination has a significantly
    positive effect on mothers' wages and that this effect is stronger for women with younger children.
    The results also show that the positive effect is particularly larger for non-college educated
    women, aged 16-44 with at least one child. These effects are also stronger for mothers with younger
    children.
  bibtex: |
    @article{ghosh2026flu,
      author  = {Ghosh, Pallab and Demir, Firat and Kim, Myongjin and Chaudhry, Ahmed and Zhao, Junying},
      title   = {Stay healthy, stay employed: how flu vaccination might impact women's earnings},
      journal = {Applied Economics},
      year    = {2026},
      pages   = {1--16},
      doi     = {10.1080/00036846.2026.2656819}
    }

- id: demir2026missingwomen
  title: "The Effects of Female Political Participation on Missing Women: Evidence from the Egyptian Protests of 2011-2014"
  authors: ["Firat Demir", "Pallab Ghosh", "Zhengang Xu"]
  journal: "Journal of Comparative Economics"
  year: 2026
  volume: "54"
  issue: "1"
  pages: "194-213"
  doi: "10.1016/j.jce.2025.09.003"
  pdf: "/assets/papers/demir2026missingwomen.pdf"
  area: labor
  status: published
  featured: true
  rank: 5
  abstract: >
    This paper examines the effects of political protests during the Egyptian revolution between 2011
    and 2014 on "missing women" in Egypt. The term "missing women" refers to the number of women missing
    in population because of sex-selective abortions, excess female mortality and lower survival rates
    caused by gender discrimination, infanticide, neglect, malnutrition, domestic violence, unequal
    healthcare access and provision, and poor treatment. We hypothesize that increased female
    participation in these protests improved women's empowerment and helped reduce missing women. Using
    a difference-in-differences analysis, our identification strategy is based on protest intensity
    heterogeneity, and changes in missing women for the age group of [0-1] before and after the protests
    across different governorates in urban and rural areas. We find convincing causal evidence that the
    number of missing women decreased significantly in high protest intensity governorates. Based on
    protest heterogeneity across different periods, we also show that this effect was most visible after
    the fourth and final phase of protests. As for possible channels, we find that domestic violence
    during pregnancy incidence fell significantly in treatment areas, while both relative vaccination
    rate of girls aged [0-1] as well as women's empowerment increased significantly.
  bibtex: |
    @article{demir2026missingwomen,
      author  = {Demir, Firat and Ghosh, Pallab and Xu, Zhengang},
      title   = {The Effects of Female Political Participation on Missing Women: Evidence from the Egyptian Protests of 2011--2014},
      journal = {Journal of Comparative Economics},
      year    = {2026},
      volume  = {54},
      number  = {1},
      pages   = {194--213},
      doi     = {10.1016/j.jce.2025.09.003}
    }

- id: ghosh2023routine
  title: "The Puzzle of Changes in Employment and Wages in Routine Task-intensive Occupations"
  authors: ["Pallab Ghosh", "Zexuan Liu"]
  journal: "Empirical Economics"
  year: 2023
  volume: "65"
  issue: "4"
  pages: "1965-1980"
  doi: "10.1007/s00181-023-02394-x"
  pdf: "/assets/papers/ghosh2023routine.pdf"
  area: labor
  status: published
  featured: false
  abstract: >
    Autor and Dorn (Am Econ Rev 103(5):1553-1597, 2013) provide an explanation of the polarization of
    US employment and wages for the period 1980-2005. Using the 1980 Census and 2005 American Community
    Survey data, this study replicates the estimation results of Autor and Dorn (2013) for employment
    polarization in all major occupation groups and qualitatively matches the wage polarization results.
    Also, we investigate the puzzle of why employment and wages changed in opposite directions only in
    clerical and administrative support occupations in 1980-2005.
