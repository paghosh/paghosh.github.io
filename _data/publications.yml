- id: zhao2025medicaid
  title: "Did the Medicaid expansion improve immunization among U.S. pregnant women?"
  authors: ["Junying Zhao", "Rashmi Jaggad", "Ahmed El Fatmaoui", "Pallab Ghosh"]
  journal: "Preventive Medicine Reports"
  year: 2025
  volume: "58"
  pages: "103214"
  doi: "10.1016/j.pmedr.2025.103214"
  pdf: "/assets/papers/zhao2025medicaid.pdf"
  area: health
  status: published
  featured: false
  abstract: >
    Objectives: Affordable Care Act (ACA) Medicaid expansion increased financial eligibility of
    low-income individuals. Its effects are mixed on influenza vaccination and unknown for Tetanus,
    Diphtheria, and Acellular Pertussis (Tdap) vaccination among pregnant women in the United States.
    We aim to address mixed and missing evidence in literature. Methods: We merged 44,320 pregnant
    women from 2011 to 15 Pregnancy Risk Assessment Monitoring System with National Welfare Data by
    residency. Treatment group included Medicaid enrollees in post-ACA expansion states. Control
    included non-Medicaid enrollees in expansion states and all individuals in non-expansion states. We
    employed triple-difference method to estimate Medicaid expansion treatment effects on individual
    vaccination probabilities, and associations with socioeconomics and demographics. Results:
    Treatment group did not differ from control to vaccinate due to Medicaid expansion. Additionally,
    post-ACA Medicaid enrollees were 4.5-9 % less likely to vaccinate than pre-ACA non-Medicaid
    enrollees. Medicaid enrollees in expansion states were 2.5 % less likely to vaccinate against
    influenza than non-Medicaid enrollees in non-expansion states. African Americans were 4-5 % less
    likely, while Native Americans were 3-7 % more likely, to vaccinate than counterparts. Those with
    low parity and college education were 3.2-5.4 % and 4.8-10.6 % more likely to vaccinate.
    Individuals in high-poverty states were 0.6 % less likely to receive the influenza vaccine.
    Conclusions: We contributed different national data on understudied populations and the
    triple-difference method to the literature. Income-based Medicaid expansion did not increase the
    likelihood of vaccination among pregnant women. Non-income-based policies may target
    Medicaid-enrolled pregnant women in expansion states for influenza vaccination. Future
    interventions may target high-parity, low-education, and African American pregnant women in
    high-poverty non-expansion states.
  bibtex: |
    @article{zhao2025medicaid,
      author  = {Zhao, Junying and Jaggad, Rashmi and El Fatmaoui, Ahmed and Ghosh, Pallab},
      title   = {Did the Medicaid expansion improve immunization among U.S. pregnant women?},
      journal = {Preventive Medicine Reports},
      year    = {2025},
      volume  = {58},
      pages   = {103214},
      doi     = {10.1016/j.pmedr.2025.103214}
    }

- id: zhao2025aian
  title: "Multi-level Determinants of Vaccination of the American Indian and Alaska Native Population: A Comprehensive Overview"
  authors: ["Junying Zhao", "Rashmi Jaggad", "Ying Zhang", "Janis E. Campbell", "Pallab Ghosh", "James R. Kennedye", "Tauqeer Ali"]
  journal: "Frontiers in Public Health"
  year: 2025
  volume: "13"
  pages: "1490286"
  doi: "10.3389/fpubh.2025.1490286"
  pdf: "/assets/papers/zhao2025aian.pdf"
  area: health
  status: published
  featured: false
  abstract: >
    Context: American Indians and Alaska Natives (AIANs) are historically disadvantaged, losing 20
    million (95%) of their population largely through epidemics since 1,520 and continuing lower
    overall vaccination coverage than other races. Determinants of this lower coverage are
    underexamined. Methods: Among peer-reviewed relevant articles since 1968, 39 studied AIANs solely;
    47 drew general population samples, including AIANs. We employed rigorous economic definitions and
    framework of Individual Decision-Making Under Uncertainty. The Social-Ecological model identified
    determinants and mechanisms at five levels. Findings: Individual-level determinants include: (1)
    vaccine-preventable disease (VPD) and vaccine knowledge; (2) vaccine safety, efficacy, moral hazard
    beliefs; (3) preferences; (4) income and post-subsidy costs. Interpersonal-level determinants
    include others' knowledge and preferences. Organizational-level characteristics of Indian Health
    Service, Tribal, Urban Indian (IHS/T/U) facilities include: (1) supply of vaccine products,
    providers, services; (2) provider cultural competency, vaccine recommendations, standing orders;
    (3) patient reminder/recall. Community-level characteristics include: (1) socioeconomics and
    geographics; (2) information infrastructure; (3) cultural values, practices, languages; (4)
    historical epidemic knowledge; (5) historical harms thus distrust in government, health system,
    science. Societal-level determinants include: (1) federal recognition and entitlements; (2) tribal
    self-determination; (3) state Medicaid enrollment; (4) structural racism. Policy recommendations:
    Tribal interventions may (1) increase AIANs' knowledge about VPDs, vaccines, Medicaid enrollment;
    (2) design risk/cost-benefit calculations using scientific objective probabilities of vaccine
    safety and efficacy; (3) tailor messages to epidemic histories, narratives, values; (4) outreach by
    trusted messengers. I/T/U organizational interventions may reduce transportation costs while
    increasing provider supplies, cultural competency, and vaccine standing orders. Federal policies
    may increase IHS funding, tribal infrastructure, and AIAN data representativeness while eliminating
    structural racism and generational trauma. Conclusion: This article contributes to literature and
    practice. It is the first multidisciplinary, comprehensive overview of multi-level determinants and
    mechanisms of AIAN vaccination. Its findings highlight the gaps and limitations of laws and
    policies impacting AIAN vaccination. It recommends future research, culturally-appropriate
    interventions, and policies to close the gap to enhance AIAN vaccination and healing.
  bibtex: |
    @article{zhao2025aian,
      author  = {Zhao, Junying and Jaggad, Rashmi and Zhang, Ying and Campbell, Janis E. and Ghosh, Pallab and Kennedye, James R. and Ali, Tauqeer},
      title   = {Multi-level Determinants of Vaccination of the American Indian and Alaska Native Population: A Comprehensive Overview},
      journal = {Frontiers in Public Health},
      year    = {2025},
      volume  = {13},
      pages   = {1490286},
      doi     = {10.3389/fpubh.2025.1490286}
    }

- id: ghosh2024hpv
  title: "Impacts of the US CDC recommendation on human papillomavirus vaccine uptake, 2010-2015"
  authors: ["Pallab Ghosh", "Ahmed Chaudhry", "Janis E. Campbell", "Myongjin Kim", "Kyle Smith", "Firat Demir", "Junying Zhao"]
  journal: "Frontiers in Public Health"
  year: 2024
  volume: "12"
  pages: "1464685"
  doi: "10.3389/fpubh.2024.1464685"
  pdf: "/assets/papers/ghosh2024hpv.pdf"
  area: health
  status: published
  featured: false
  abstract: >
    Objectives: As one type of vaccine policy, the effectiveness and spillover effects of the US CDC
    vaccine recommendations are inadequately evaluated. This study aims to fully evaluate its impacts
    on male adults, in addition to children, using better data. Design: A before-after study design to
    examine the CDC's 2011 HPV vaccine recommendation for men aged 11-21. Data analysis:
    Individual-level data included the 2010-2015 US National Health Interview Survey full sample of
    7,000 male children aged 11-18, younger adults aged 19-21 and 22-25, and older adults aged 26-60.
    Pooled cross-sectional surveys contained individual-level vaccination, socioeconomic, and
    demographic information. Outcome variable is an individual HPV vaccination status, measured as
    individual probability of HPV vaccination. Dummy regressions were estimated by a Linear Probability
    Model (LPM) with fixed effects for target and non-target age groups. Results: The policy was
    significantly associated with a 14.8% (p < 0.001) increased individual likelihood of HPV
    vaccination for men aged 11-21. It was also associated with a modest spillover effect, a 5.6%
    (p < 0.001) increased individual likelihood for men aged 22-25 and marginally for men aged 26-60.
    African American men and men with poor health were 2.7 and 15.4% less likely to uptake HPV
    vaccines than white men and men with good or fair health, respectively. Conclusion: This study
    complements the existing policy evaluation literature on HPV vaccine recommendation among male
    children by including adults and using better data. Findings offer comprehensive evidence of the
    effectiveness and spillover effects of this recommendation type of federal-level policy, provide
    policy lessons for other vaccines, and identify vulnerable subpopulations as targets for future
    policies.
  bibtex: |
    @article{ghosh2024hpv,
      author  = {Ghosh, Pallab and Chaudhry, Ahmed and Campbell, Janis E. and Kim, Myongjin and Smith, Kyle and Demir, Firat and Zhao, Junying},
      title   = {Impacts of the US CDC recommendation on human papillomavirus vaccine uptake, 2010--2015},
      journal = {Frontiers in Public Health},
      year    = {2024},
      volume  = {12},
      pages   = {1464685},
      doi     = {10.3389/fpubh.2024.1464685}
    }

- id: zhao2022countermeasures
  title: "Reforming the Countermeasures Injury Compensation Program for COVID-19 and Beyond: An Economic Perspective"
  authors: ["Junying Zhao", "Firat Demir", "Pallab Ghosh", "Austin Earley", "Myongjin Kim"]
  journal: "Journal of Law and the Biosciences"
  year: 2022
  volume: "9"
  issue: "1"
  pages: "lsac008"
  doi: "10.1093/jlb/lsac008"
  pdf: "/assets/papers/zhao2022countermeasures.pdf"
  area: health
  status: published
  featured: true
  rank: 6
  citations: 22
  abstract: >
    As of Aug. 2, 2021, 1693 injury claims associated with COVID-19 medical countermeasures have been
    filed in the Countermeasures Injury Compensation Program (CICP), of which 686 claims were related
    to COVID-19 vaccines and urgently needed compensation decisions. However, from an economic and
    public policy perspective, we find that the CICP design has unintended consequences: locating CICP
    in the executive agency DHHS potentially creates a conflict of interest, and not permitting
    judicial review generates a lack of checks and balances, both of which could jeopardize justice.
    These fundamental problems would subsequently weaken four key performance indicators of CICP
    compared with its judicial counterpart in the Court of Federal Claims. CICP lacks accountability,
    transparency, and cost-effectiveness efficiency, with 94% of its total costs spent on
    administration rather than compensation. CICP's ability to compensate is also questionable. If
    COVID-19 claims were compensated at its historical rate, CICP would face around $21.16 million in
    compensation outlays and $317.94 million in total outlays, 72.1 times its current balance. To
    ensure just compensation for injured petitioners during COVID-19 and future public health
    emergencies, we recommend Congress (1) initiate a major reform by relocating CICP from DHHS to the
    Claims Court or (2) keep CICP within DHHS and make incremental changes by permitting judicial
    review of DHHS administrative adjudication of CICP claims. We further recommend Congress audit and
    adjust budgets for CICP and DHHS promptly propose an injury table for COVID-19 claims. This is the
    first study that contributes an economic perspective to the limited literature on CICP and also
    provides unique and rich economic data.
  bibtex: |
    @article{zhao2022countermeasures,
      author  = {Zhao, Junying and Demir, Firat and Ghosh, Pallab and Earley, Austin and Kim, Myongjin},
      title   = {Reforming the Countermeasures Injury Compensation Program for COVID-19 and Beyond: An Economic Perspective},
      journal = {Journal of Law and the Biosciences},
      year    = {2022},
      volume  = {9},
      number  = {1},
      pages   = {lsac008},
      doi     = {10.1093/jlb/lsac008}
    }

