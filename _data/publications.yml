      author  = {Demir, Firat and Ghosh, Pallab and Liu, Zexuan},
      title   = {Effects of Motherhood Timing, Breastmilk Substitutes and Education on the Duration of Breastfeeding: Evidence from Egypt},
      journal = {World Development},
      year    = {2020},
      volume  = {133},
      pages   = {105014},
      doi     = {10.1016/j.worlddev.2020.105014}
    }

- id: ghosh2020coauthorship
  title: "Coauthorship and the Gender Gap in Top Economics Journal Publications"
  authors: ["Pallab Ghosh", "Zexuan Liu"]
  journal: "Applied Economics Letters"
  year: 2020
  volume: "27"
  issue: "7"
  pages: "580-590"
  doi: "10.1080/13504851.2019.1644420"
  pdf: "/assets/papers/ghosh2020coauthorship.pdf"
  area: labor
  status: published
  featured: true
  rank: 3
  citations: 46
  abstract: >
    Coauthorship has become the new norm in academics since the early 1970s because it enhances
    productivity. However, the gender gap in economics journal publication continues to persist, which
    explains why there are fewer women than men in the economics profession. This study investigates
    the role of coauthorship in the gender gap in top economics journals for untenured faculty members
    in the US. We construct a unique dataset from the CVs of academic economists from the top 96
    PhD-granting economics departments in the US. Our results suggest that, compared to men, women are
    matched with less productive unique coauthors because women begin their academic careers in
    lower-ranked economics departments than men, which is associated with institutional gender bias.
    This poor-quality matching can explain approximately 0.60 fewer publications in the top 20
    economics journals during the untenured period.
  bibtex: |
    @article{ghosh2020coauthorship,
      author  = {Ghosh, Pallab and Liu, Zexuan},
      title   = {Coauthorship and the Gender Gap in Top Economics Journal Publications},
      journal = {Applied Economics Letters},
      year    = {2020},
      volume  = {27},
      number  = {7},
      pages   = {580--590},
      doi     = {10.1080/13504851.2019.1644420}
    }

- id: ghosh2020minimumwage
  title: "Do State Minimum Wages Affect the Incarceration Rate?"
  authors: ["Pallab Ghosh", "Gary A. Hoover", "Zexuan Liu"]
  journal: "Southern Economic Journal"
  year: 2020
  volume: "86"
  issue: "3"
  pages: "845-872"
  doi: "10.1002/soej.12400"
  pdf: "/assets/papers/ghosh2020minimumwage.pdf"
  area: labor
  status: published
  featured: false
  abstract: >
    Because of historically unprecedented increases in the prison population since the late 1970s, the
    United States has the highest incarceration rate in the world. Using Becker's (1968) framework on
    crime, this study investigates the causal relationship between incarceration rates and state
    minimum wages. Our identification strategy consists of a state-level fixed effects model and Autor
    and Dorn's (2013) two-stage least-squares (2SLS) approach. Using the historical local industry
    structure, we predict the change in employment shares of manual task-intensive occupations and use
    those as an instrument for state minimum wages. The fixed effects and 2SLS estimates suggest that a
    one-dollar increase in state minimum wage leads to approximately 12-25 fewer incarcerations per
    100,000 state residents. Estimates of the heterogeneous impacts by race and gender indicate that
    the aggregate impact of state minimum wages is entirely driven by men.
  bibtex: |
    @article{ghosh2020minimumwage,
      author  = {Ghosh, Pallab and Hoover, Gary A. and Liu, Zexuan},
      title   = {Do State Minimum Wages Affect the Incarceration Rate?},
      journal = {Southern Economic Journal},
      year    = {2020},
      volume  = {86},
      number  = {3},
      pages   = {845--872},
      doi     = {10.1002/soej.12400}
    }

- id: ghosh2018recession
  title: "The Short-Run Effects of the Great Recession on Crime"
  authors: ["Pallab Ghosh"]
  journal: "Journal of Economics, Race, and Policy"
  year: 2018
  volume: "1"
  issue: "2-3"
  pages: "92-111"
  doi: "10.1007/s41996-018-0014-8"
  pdf: "/assets/papers/ghosh2018recession.pdf"
  area: labor
  status: published
  featured: false
  abstract: >
    The Great Recession had the most severe impacts on the unemployment rates of the racial and ethnic
    minorities as well as less-educated young men. There were cross-sectional variations of these
    disproportionate adverse impacts. This study exploits the changes in regional variations of the
    unemployment rates of unskilled men before and after the Great Recession to explain the sharp fall
    in aggregate crime rates in the post-recession recovery period. Our 2SLS approach uses plausible
    exogenous sources of changes in the state employment growth of minimum wage workers induced by the
    national employment growth of minimum wage workers. We find that changes in regional variations of
    the unemployment rates of unskilled young men can explain approximately 25% of the fall in the
    aggregate crime rate in the post-recession expansionary period. Estimating the heterogeneous
    impacts of unskilled young men by race, we find that the fall in aggregate crime rate was mainly
    driven by the changes in the unemployment rates of young black men.
  bibtex: |
    @article{ghosh2018recession,
      author  = {Ghosh, Pallab},
      title   = {The Short-Run Effects of the Great Recession on Crime},
      journal = {Journal of Economics, Race, and Policy},
      year    = {2018},
      volume  = {1},
      number  = {2--3},
      pages   = {92--111},
      doi     = {10.1007/s41996-018-0014-8}
    }

- id: ghosh2016korea
  title: "Decomposition of Changes in Korean Wage Inequality, 1998-2007"
  authors: ["Pallab Ghosh", "Jae Yoon Lee"]
  journal: "Journal of Labor Research"
  year: 2016
  volume: "37"
  issue: "1"
  pages: "1-28"
  doi: "10.1007/s12122-015-9217-9"
  pdf: "/assets/papers/ghosh2016korea.pdf"
  area: labor
  status: published
  featured: false
  abstract: >
    South Korea experienced a steep increase in wage inequality between the Asian financial crisis in
    1997 and the global financial crisis in 2008. This paper investigates the causes of the sharp change
    during that time period by looking at the contributions of changes in the distributions of
    schooling and unionization. The effects are estimated applying two robust distributional function
    based decomposition methods on Korean Labor and Panel Survey data for the time period 1998-2007.
    The results suggest changes in the distribution of schooling can explain about 10 % of the changes
    in the 90/50 percentile wage gap. The declining unionization rate does not have much impact on the
    upward trend of Korean wage inequality. In addition, aggregate decomposition results suggest that
    changes in labor force composition can explain a significant proportion of the total wage changes
    in the upper-tail of the distribution. Based on our findings we provide a list of policy
    recommendations to address the wage inequality issue in Korea.
  bibtex: |
    @article{ghosh2016korea,
      author  = {Ghosh, Pallab and Lee, Jae Yoon},
      title   = {Decomposition of Changes in Korean Wage Inequality, 1998--2007},
      journal = {Journal of Labor Research},
      year    = {2016},
      volume  = {37},
      number  = {1},
      pages   = {1--28},
      doi     = {10.1007/s12122-015-9217-9}
    }

- id: ghosh2014humancapital
  title: "The Contribution of Human Capital Variables to Changes in the Wage Distribution Function"
  authors: ["Pallab Ghosh"]
  journal: "Labour Economics"
  year: 2014
  volume: "28"
  pages: "58-69"
  doi: "10.1016/j.labeco.2014.03.006"
  pdf: "/assets/papers/ghosh2014humancapital.pdf"
  area: labor
  status: published
  featured: true
  rank: 2
  citations: 12
  abstract: >
    This paper proposes a semi-parametric procedure to determine the contribution of human capital
    variables in explaining the changes of U.S. wage distribution function over the period of
    1990-2000. The effects of these factors are estimated by using the Chamberlain's two stage Box-Cox
    quantile regression approach. One of the main contributions of this paper is that it relaxes the
    linearity assumption of the conditional quantile function to estimate the counterfactual wage
    distribution function consistently. This paper also shows that the proposed method provides better
    estimates of capturing the effects of human capital variables in the two tails of the wage
    distribution while the results of other parts of the distribution are comparable with the estimates
    of the previous study which used the linear quantile regression approach. To summarize, these
    results suggest that this proposed approach is more applicable in cases where the behavior of the
    tails of the distribution bear much importance.
  bibtex: |
    @article{ghosh2014humancapital,
      author  = {Ghosh, Pallab},
      title   = {The Contribution of Human Capital Variables to Changes in the Wage Distribution Function},
      journal = {Labour Economics},
      year    = {2014},
      volume  = {28},
      pages   = {58--69},
      doi     = {10.1016/j.labeco.2014.03.006}
    }

