      volume  = {35},
      number  = {4},
      pages   = {578--605},
      doi     = {10.1080/10438599.2025.2511865}
    }

- id: zhao2026ihs
  title: "Empirical Evidence and Conceptual Framework to Address the Indian Health Service Underfunding Challenge"
  authors: ["Junying Zhao", "Rashmi Jaggad", "James R. Kennedye", "Pallab Ghosh", "Kylie Stewart", "Janis E. Campbell"]
  journal: "Value in Health"
  year: 2026
  volume: "29"
  issue: "3"
  pages: "403-412"
  doi: "10.1016/j.jval.2025.10.003"
  area: health
  status: published
  featured: false
  abstract: >
    Objectives: The Indian Health Service (IHS) provides services to American Indian and Alaska Native
    individuals. However, IHS faces a longstanding underfunding problem. This article examines the
    extent, reasons, and alternative solutions for the IHS underfunding problem. Methods: We used the
    most recent 15-year quantitative and qualitative data from a fiscal administration perspective and
    established a conceptual framework from an economic perspective to better understand the nature of
    financing IHS. We applied the framework, especially efficiency and equity criteria, to examine the
    justifiability of proposed benchmarks for IHS budgeting and compare proposed solutions. Results:
    First, we identified budget planning and approving steps where significant IHS budget cuts occurred
    and why. Second, the United States has a federal Indian trust responsibility for American Indian
    and Alaska Native healthcare and thus mandatory spending in principle. However, in practice, it has
    been a discretionary spending decision for the United States to maximize social welfare subject to
    limited fiscal resources. Third, between the 2 economic criteria for resource allocation, vertical
    equity, instead of allocative efficiency, justifies more IHS appropriations. Fourth, entitlement
    mandatory spending on IHS was proposed by legislators during 2001 to 2004 but failed to receive
    Congressional votes. Nonentitlement mandatory spending and sequestration exemption were proposed by
    the President but were unapproved for fiscal year 2024. Conclusions: To our knowledge, this article
    is the first to evaluate discrepancies in IHS budget proposals, before and during enactment, to
    elucidate the stages at which underfunding may occur and the implications for future research and
    policy making by the IHS, Tribal Nations, and US Congress.
  bibtex: |
    @article{zhao2026ihs,
      author  = {Zhao, Junying and Jaggad, Rashmi and Kennedye, James R. and Ghosh, Pallab and Stewart, Kylie and Campbell, Janis E.},
      title   = {Empirical Evidence and Conceptual Framework to Address the Indian Health Service Underfunding Challenge},
      journal = {Value in Health},
      year    = {2026},
      volume  = {29},
      number  = {3},
      pages   = {403--412},
      doi     = {10.1016/j.jval.2025.10.003}
    }

- id: zhao2025advice
  title: "Power of Public Health Advice: Effectiveness and Spillover Effects of Federal Vaccine Recommendations"
  authors: ["Junying Zhao", "Ahmed El Fatmaoui", "Mahla Shourian", "Bethanie Lor", "Pallab Ghosh"]
  journal: "Public Health in Practice"
  year: 2025
  volume: "10"
  pages: "100667"
  doi: "10.1016/j.puhip.2025.100667"
  pdf: "/assets/papers/zhao2025advice.pdf"
  area: health
  status: published
  featured: false
  abstract: >
    Objectives: This paper focuses on the national-level, inexpensive, demand-side vaccine policy,
    federal recommendations. It evaluates the effectiveness of 2008 and 2010 influenza vaccine
    recommendations, the spillover effect of the 2009 H1N1 vaccine recommendation on influenza
    vaccination, and heterogeneous policy effects across individual characteristics. Study design:
    Observational study with before-after comparison assessing changes in vaccination following policy
    implementation. Methods: We used nationally representative 2004-2015 NHIS data on 77,361, 23,653,
    and 238,866 individuals in age groups targeted by the 2008, 2009, and 2010 policies, respectively.
    Using the Linear Probability Model with fixed effects, we estimated policy effectiveness, spillover
    effects, and heterogeneous effects across individual characteristics. Results: Both 2008 and 2010
    influenza vaccine recommendations boosted influenza vaccination likelihood by 20.9-26.5 % among
    children and 5.2-6.6 % among older adults. The 2009 H1N1 vaccine recommendation had a positive
    spillover effect, with a 5.7-9.8 % increase in influenza vaccination likelihood among younger
    adults. Low influenza vaccination likelihoods exist across demographic and socioeconomic
    characteristics: Children uninsured or privately insured, White, and low-income; Adults uninsured
    or publicly insured, White, African and Hispanic American, male, childless, self-reported poor or
    excellent health, low-educated, and low-income. Conclusions: Future policies may address the cost
    barriers faced by the uninsured, and multi-level non-cost barriers experienced by privately insured
    children and publicly insured adults. Future policies may consider extending beyond the federal
    recommendation, such as implementing simultaneous anti-poverty policies, to achieve minimum
    coverage and utilize the spillover effects of one vaccine policy to maximize coverage of other
    vaccines. Future research may investigate potential policy spillover effects among influenza,
    COVID-19, RSV, and new vaccines.
  bibtex: |
    @article{zhao2025advice,
      author  = {Zhao, Junying and El Fatmaoui, Ahmed and Shourian, Mahla and Lor, Bethanie and Ghosh, Pallab},
      title   = {Power of Public Health Advice: Effectiveness and Spillover Effects of Federal Vaccine Recommendations},
      journal = {Public Health in Practice},
      year    = {2025},
      volume  = {10},
      pages   = {100667},
      doi     = {10.1016/j.puhip.2025.100667}
    }

