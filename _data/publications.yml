- id: ghosh2021boxcox
  title: "Box-Cox Power Transformation Unconditional Quantile Regressions With An Application on Wage Inequality"
  authors: ["Pallab Ghosh"]
  journal: "Journal of Applied Statistics"
  year: 2021
  volume: "48"
  issue: "16"
  pages: "3086-3101"
  doi: "10.1080/02664763.2020.1795817"
  pdf: "/assets/papers/ghosh2021boxcox.pdf"
  area: econometrics
  status: published
  featured: false
  abstract: >
    This study proposes a semi-parametric estimation method, Box-Cox power transformation unconditional
    quantile regression, to estimate the impact of changes in the distribution of the explanatory
    variables on the unconditional quantile of the outcome variable. The proposed method consists of
    running a nonlinear regression of the recentered influence function (RIF) of the outcome variable
    on the explanatory variables. We also show the asymptotic properties of the proposed estimator and
    apply the estimation method to address an existing puzzle in labor economics: why the 50th/10th
    percentile wage gap has been falling in the USA since the late 1980s. Our results show that
    declining unionization can explain approximately 10% of the decline in the 50/10 wage gap in
    1990-2000 and 23% in 2000-2010.
  bibtex: |
    @article{ghosh2021boxcox,
      author  = {Ghosh, Pallab},
      title   = {Box-Cox Power Transformation Unconditional Quantile Regressions With An Application on Wage Inequality},
      journal = {Journal of Applied Statistics},
      year    = {2021},
      volume  = {48},
      number  = {16},
      pages   = {3086--3101},
      doi     = {10.1080/02664763.2020.1795817}
    }

- id: ghosh2021heterogeneous
  title: "Heterogeneous Endogeneity"
  authors: ["Pallab Ghosh", "Kevin Grier", "Jaeho Kim"]
  journal: "Statistical Papers"
  year: 2021
  volume: "62"
  issue: "2"
  pages: "847-886"
  doi: "10.1007/s00362-019-01116-9"
  pdf: "/assets/papers/ghosh2021heterogeneous.pdf"
  area: econometrics
  status: published
  featured: false
  abstract: >
    We define heterogeneous endogeneity as the case where a potentially endogenous regressor is
    endogenous for some sub-groups of the data but exogenous for other subgroups. We derive an
    estimator and test procedure based on the control function approach to deal with the phenomenon.
    We show that accounting for heterogeneous endogeneity can greatly increase the power of endogeneity
    tests and increase the precision of our estimator over traditional IV. While the gains get larger
    as the instrument gets weaker and as the relative size of the non-endogenous subgroup gets larger,
    we find efficiency gains even when the underlying instrument is very strong. We illustrate our
    approach with an example using data from Abaide et al. (Econometrica 70:91-117).
  bibtex: |
    @article{ghosh2021heterogeneous,
      author  = {Ghosh, Pallab and Grier, Kevin and Kim, Jaeho},
      title   = {Heterogeneous Endogeneity},
      journal = {Statistical Papers},
      year    = {2021},
      volume  = {62},
      number  = {2},
      pages   = {847--886},
      doi     = {10.1007/s00362-019-01116-9}
    }

- id: baltagi2019partial
  title: "Partial Distributional Policy Effects Under Endogeneity"
  authors: ["Badi H. Baltagi", "Pallab Ghosh"]
  journal: "Sankhya B"
  year: 2019
  volume: "81"
  issue: "S1"
  pages: "123-145"
  doi: "10.1007/s13571-019-00190-1"
  pdf: "/assets/papers/baltagi2019partial.pdf"
  area: econometrics
  status: published
  featured: false
  abstract: >
    Rothe (Econometrica 80, 2269-2301 2012) introduces a new class of parameters called "Partial
    Distributional Policy Effects" (PPE) to estimate the impact on the marginal distribution of an
    outcome variable due to a change in the unconditional distribution of a single covariate. Since the
    strict exogeneity assumption of all covariates makes this approach less applicable in empirical
    research, we propose the identification of the PPEs for a continuous endogenous explanatory
    variable using the control variable approach developed by Imbens and Newey (Econometrica 77,
    1481-1512 2009). We also apply this proposed control variable PPE approach to investigate how
    poverty and black-white racial wage gaps contribute to the steep increase in the incarceration rate
    of black men over the period 1980-2010. Our control variable PPE estimates suggest that although
    the fall in the racial wage gap does not explain the changes in the incarceration rate of black
    men, changes in the poverty rate contribute about one-third of the steep increase in the
    incarceration rate at the upper-tail of the distribution.
  bibtex: |
    @article{baltagi2019partial,
      author  = {Baltagi, Badi H. and Ghosh, Pallab},
      title   = {Partial Distributional Policy Effects Under Endogeneity},
      journal = {Sankhya B},
      year    = {2019},
      volume  = {81},
      number  = {S1},
      pages   = {123--145},
      doi     = {10.1007/s13571-019-00190-1}
    }

