- id: kim2025vaccine
  title: "Vaccine Production and Innovation: Insights from Tort Reform and Medicare Expansion"
  authors: ["Myongjin Kim", "Firat Demir", "Ahmed El Fatmaoui", "Qi Ge", "Pallab Ghosh", "Junying Zhao"]
  journal: "Economics of Innovation and New Technology"
  year: 2025
  volume: "35"
  issue: "4"
  pages: "578-605"
  doi: "10.1080/10438599.2025.2511865"
  pdf: "/assets/papers/kim2025vaccine.pdf"
  area: health
  status: published
  featured: false
  abstract: >
    Leveraging a unique dataset on vaccine production and development, this paper assesses the
    effectiveness of two policy interventions in stimulating firms' output and innovation, including
    (1) a tort reform that reduces vaccine manufacturers' product liability; and (2) an expansion of
    Medicare's coverage of vaccine products. A difference-in-differences analysis indicates that both
    policies significantly boost vaccine production, with the impact of Medicare coverage expansion
    being 3-6 times larger in magnitude. There is also evidence suggesting that vaccine manufacturers
    are more likely to invest in R&D in response to this expansion, and the effect is likely driven by
    the underlying market structure.
